[workspace]
resolver = "2"
members = [
    "crates/ycrawl-core",
    "crates/ycrawl-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yetidevworks/ycrawl"
authors = ["YetiDevWorks"]

[workspace.dependencies]
ycrawl-core = { path = "crates/ycrawl-core", version = "1.0.0" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = "symbols"
